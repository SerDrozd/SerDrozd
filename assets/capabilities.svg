<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop stop-color="#0d1424"/>
    <stop offset="1" stop-color="#101827"/>
  </linearGradient>
</defs>

<rect width="1200" height="430" rx="28" fill="url(#bg)"/>

<text x="48" y="55" fill="#f8fafc" font-size="24" font-weight="700" font-family="Segoe UI,Arial">What I build</text>
<text x="48" y="85" fill="#94a3b8" font-size="15" font-family="Segoe UI,Arial">
  Practical systems around real business problems — not technology for its own sake.
</text>

<!-- APIs & integrations -->
<rect x="48" y="115" width="530" height="125" rx="18" fill="#111c2d" stroke="#25354c"/>
<circle cx="82" cy="150" r="16" fill="#123e5a"/>
<text x="76" y="157" fill="#7dd3fc" font-size="18" font-family="Segoe UI,Arial">↔</text>
<text x="112" y="151" fill="#e2e8f0" font-size="19" font-weight="700" font-family="Segoe UI,Arial">APIs &amp; integrations</text>
<text x="80" y="184" fill="#aebbc9" font-size="14" font-family="Segoe UI,Arial">
  FastAPI services · REST APIs · webhooks · SaaS integrations
</text>
<text x="80" y="207" fill="#7f8ea3" font-size="13" font-family="Segoe UI,Arial">
  Connect systems, fix fragile handoffs, ship clean backend pieces.
</text>

<!-- Business automation -->
<rect x="622" y="115" width="530" height="125" rx="18" fill="#111c2d" stroke="#25354c"/>
<circle cx="656" cy="150" r="16" fill="#2b225a"/>
<text x="649" y="157" fill="#c4b5fd" font-size="18" font-family="Segoe UI,Arial">⚙</text>
<text x="686" y="151" fill="#e2e8f0" font-size="19" font-weight="700" font-family="Segoe UI,Arial">Business automation</text>
<text x="654" y="184" fill="#aebbc9" font-size="14" font-family="Segoe UI,Arial">
  Scheduled jobs · repetitive workflows · notifications · tooling
</text>
<text x="654" y="207" fill="#7f8ea3" font-size="13" font-family="Segoe UI,Arial">
  Turn manual routines into reliable, observable software.
</text>

<!-- Practical AI workflows -->
<rect x="48" y="265" width="530" height="125" rx="18" fill="#111c2d" stroke="#25354c"/>
<circle cx="82" cy="300" r="16" fill="#183a31"/>
<text x="75" y="307" fill="#6ee7b7" font-size="18" font-family="Segoe UI,Arial">AI</text>
<text x="112" y="301" fill="#e2e8f0" font-size="19" font-weight="700" font-family="Segoe UI,Arial">Practical AI workflows</text>
<text x="80" y="334" fill="#aebbc9" font-size="14" font-family="Segoe UI,Arial">
