</text>

<!-- Data & internal tools -->
<rect x="622" y="265" width="530" height="125" rx="18" fill="#111c2d" stroke="#25354c"/>
<circle cx="656" cy="300" r="16" fill="#3c2d18"/>
<text x="648" y="307" fill="#fbbf24" font-size="18" font-family="Segoe UI,Arial">DB</text>
<text x="686" y="301" fill="#e2e8f0" font-size="19" font-weight="700" font-family="Segoe UI,Arial">Data &amp; internal tools</text>
