  <text x="48" y="220" fill="#cbd5e1" font-size="19" font-family="Segoe UI, Arial, sans-serif">I turn messy manual workflows into reliable software.</text>
  <text x="48" y="253" fill="#94a3b8" font-size="16" font-family="Segoe UI, Arial, sans-serif">FastAPI · PostgreSQL · REST APIs · Webhooks · Data · OpenAI/LLM</text>
