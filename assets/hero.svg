    <text x="88" y="31" fill="#64748b" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">workflow.py</text>
    <text x="28" y="78" fill="#64748b" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">01</text>
    <text x="62" y="78" fill="#e2e8f0" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">manual_work</text>
