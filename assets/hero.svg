    <text x="252" y="158" fill="#a78bfa" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">automate()</text>
    <text x="28" y="198" fill="#64748b" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">04</text>
    <text x="62" y="198" fill="#e2e8f0" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">result</text>
