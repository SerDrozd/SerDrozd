    <text x="252" y="78" fill="#f59e0b" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">find_bottleneck()</text>
    <text x="28" y="118" fill="#64748b" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">02</text>
    <text x="62" y="118" fill="#e2e8f0" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">systems</text>
    <text x="220" y="118" fill="#64748b" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">→</text>
    <text x="252" y="118" fill="#38bdf8" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">connect_apis()</text>
    <text x="28" y="158" fill="#64748b" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">03</text>
    <text x="62" y="158" fill="#e2e8f0" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">workflow</text>
