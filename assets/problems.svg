<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330">
<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0" stop-color="#0d1424"/>
    <stop offset="1" stop-color="#101827"/>
  </linearGradient>
</defs>
<rect width="1200" height="330" rx="28" fill="url(#bg)"/>
<text x="48" y="54" fill="#f8fafc" font-size="24" font-weight="700" font-family="Segoe UI,Arial">Problems I like taking off someone's plate</text>
<text x="48" y="82" fill="#94a3b8" font-size="14" font-family="Segoe UI,Arial">The work usually starts with friction, not a perfect specification.</text>

<!-- 1 -->
<rect x="48" y="118" width="344" height="160" rx="18" fill="#111c2d" stroke="#25354c"/>
<rect x="68" y="138" width="54" height="25" rx="12" fill="#3a2413"/>
<text x="95" y="155" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700" font-family="Segoe UI,Arial">PAIN</text>
<text x="68" y="194" fill="#e2e8f0" font-size="18" font-weight="700" font-family="Segoe UI,Arial">“We do this manually.”</text>
<text x="68" y="224" fill="#8fa0b5" font-size="13" font-family="Segoe UI,Arial">Copying data, repetitive admin,</text>
<text x="68" y="244" fill="#8fa0b5" font-size="13" font-family="Segoe UI,Arial">scheduled routines, handoffs.</text>
<text x="68" y="267" fill="#86efac" font-size="13" font-weight="700" font-family="Segoe UI,Arial">→ automation workflow</text>

<!-- 2 -->
<rect x="428" y="118" width="344" height="160" rx="18" fill="#111c2d" stroke="#25354c"/>
<rect x="448" y="138" width="54" height="25" rx="12" fill="#351c24"/>
<text x="475" y="155" text-anchor="middle" fill="#fda4af" font-size="11" font-weight="700" font-family="Segoe UI,Arial">PAIN</text>
<text x="448" y="194" fill="#e2e8f0" font-size="18" font-weight="700" font-family="Segoe UI,Arial">“This integration breaks.”</text>
<text x="448" y="224" fill="#8fa0b5" font-size="13" font-family="Segoe UI,Arial">Fragile API calls, webhook failures,</text>
<text x="448" y="244" fill="#8fa0b5" font-size="13" font-family="Segoe UI,Arial">unclear errors, inconsistent state.</text>
<text x="448" y="267" fill="#7dd3fc" font-size="13" font-weight="700" font-family="Segoe UI,Arial">→ reliable API flow</text>

<!-- 3 -->
<rect x="808" y="118" width="344" height="160" rx="18" fill="#111c2d" stroke="#25354c"/>
<rect x="828" y="138" width="54" height="25" rx="12" fill="#271f48"/>
<text x="855" y="155" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="700" font-family="Segoe UI,Arial">PAIN</text>
<text x="828" y="194" fill="#e2e8f0" font-size="18" font-weight="700" font-family="Segoe UI,Arial">“Our data is messy.”</text>
<text x="828" y="224" fill="#8fa0b5" font-size="13" font-family="Segoe UI,Arial">Forms, CSVs, documents, scraped</text>
<text x="828" y="244" fill="#8fa0b5" font-size="13" font-family="Segoe UI,Arial">data, inconsistent structures.</text>
<text x="828" y="267" fill="#c4b5fd" font-size="13" font-weight="700" font-family="Segoe UI,Arial">→ structured pipeline</text>
</svg>
